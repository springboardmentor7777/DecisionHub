spring.application.name=decisionhub
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/decisionhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Flyway is on the classpath but there are no migration scripts yet; the schema is managed by
# Hibernate (ddl-auto). Leaving it enabled breaks startup on databases that already have tables.
# To adopt Flyway later: add scripts under src/main/resources/db/migration, set
# spring.flyway.baseline-on-migrate=true for existing databases, then enable it and set ddl-auto=validate.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:development-only-secret-replace-with-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
