services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: decisionhub
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-local-development-password}
    ports:
      - "3306:3306"
    volumes:
      - decisionhub-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DATABASE_PASSWORD:-local-development-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://database:3306/decisionhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a private value of at least 32 bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  decisionhub-mysql:
